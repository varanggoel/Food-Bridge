services:
  - type: web
    name: foodbridge-backend
    runtime: python
    rootDir: foodbridge/backend
    buildCommand: cd foodbridge/backend && pip install -r requirements.txt
    startCommand: cd foodbridge/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: MAX_DISTANCE_KM
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.10"
